[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpelab"
version = "0.1.0"
description = "Train, inspect and compare byte-pair encoding tokenizers from scratch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bpe", "tokenizer", "nlp", "llm", "education"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bpelab = "bpelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
